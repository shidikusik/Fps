<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- BLOODRUSH icon: blood drop in a neon crosshair on black -->
  <rect x="4" y="4" width="120" height="120" rx="14" fill="#120a0c"/>
  <rect x="4" y="4" width="120" height="120" rx="14" fill="none" stroke="#e61e28" stroke-width="4"/>
  <!-- crosshair -->
  <line x1="64" y1="10" x2="64" y2="30" stroke="#ffe600" stroke-width="6" stroke-linecap="square"/>
  <line x1="64" y1="98" x2="64" y2="118" stroke="#ffe600" stroke-width="6" stroke-linecap="square"/>
  <line x1="10" y1="64" x2="30" y2="64" stroke="#ffe600" stroke-width="6" stroke-linecap="square"/>
  <line x1="98" y1="64" x2="118" y2="64" stroke="#ffe600" stroke-width="6" stroke-linecap="square"/>
  <!-- blood drop, low-poly -->
  <polygon points="64,26 84,58 88,74 80,92 64,100 48,92 40,74 44,58"
           fill="#e61e28"/>
  <polygon points="64,26 84,58 64,66 44,58" fill="#ff4652"/>
  <polygon points="64,66 88,74 80,92 64,100" fill="#b01018"/>
  <!-- highlight -->
  <polygon points="54,52 60,44 62,56 55,60" fill="#ffd9dc" opacity="0.85"/>
</svg>
