app-id: io.github.shidikusik.Bloodrush
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: bloodrush

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio

modules:
  # Flathub builds run offline, so raylib is a pinned module instead of
  # the CMake FetchContent fallback.
  - name: raylib
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_EXAMPLES=OFF
      - -DGLFW_BUILD_WAYLAND=ON
      - -DGLFW_BUILD_X11=ON
    sources:
      - type: archive
        url: https://github.com/raysan5/raylib/archive/refs/tags/5.5.tar.gz
        sha256: aea98ecf5bc5c5e0b789a76de0083a21a70457050ea4cc2aec7566935f5e258e

  - name: bloodrush
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/shidikusik/Fps.git
        # CI builds the latest branch state. For a Flathub submission,
        # replace `branch` with a release `tag:` plus a pinned `commit:`
        # (create the tag on GitHub: Releases -> Draft a new release).
        branch: claude/bloodrush-fps-game-01wbax
